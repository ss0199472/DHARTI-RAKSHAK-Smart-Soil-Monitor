<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="#10b981" stroke-width="8" stroke-opacity="0.3"/>
  
  <!-- Subtle Glowing Circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#34d399" stroke-width="4" stroke-dasharray="8 8" opacity="0.4"/>

  <!-- Earth / Soil Node Sphere -->
  <circle cx="256" cy="256" r="140" fill="#042f2e" stroke="#10b981" stroke-width="12" filter="url(#glow)"/>

  <!-- Leaf Emblem -->
  <path d="M256 140 C190 200 170 300 256 360 C342 300 322 200 256 140 Z" fill="url(#leafGrad)"/>
  <path d="M256 180 L256 350" stroke="#064e3b" stroke-width="6" stroke-linecap="round"/>
  <path d="M256 240 Q225 220 210 230" stroke="#064e3b" stroke-width="5" stroke-linecap="round"/>
  <path d="M256 280 Q285 260 300 270" stroke="#064e3b" stroke-width="5" stroke-linecap="round"/>

  <!-- Pulse dots -->
  <circle cx="256" cy="116" r="10" fill="#34d399"/>
  <circle cx="396" cy="256" r="8" fill="#10b981"/>
  <circle cx="116" cy="256" r="8" fill="#10b981"/>
</svg>
